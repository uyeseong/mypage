<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우예성 | Frontend Developer</title>
    <!-- 구글 폰트 적용 (Pretendard 스타일의 Montserrat와 Noto Sans 조합) -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161920;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-glow: #38bdf8;
            --accent-purple: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* 부드러운 스크롤 */
        html {
            scroll-behavior: smooth;
        }

        /* 컨테이너 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* 내비게이션 바 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            backdrop-filter: blur(12px);
            background: rgba(13, 14, 18, 0.8);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: -1px;
            background: linear-gradient(45deg, var(--accent-glow), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-glow);
        }

        /* 히어로 섹션 */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
        }

        .hero-content h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            display: block;
            background: linear-gradient(to right, #ffffff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content .highlight {
            background: linear-gradient(45deg, var(--accent-glow), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.25rem;
            color: var(--text-sub);
            max-width: 600px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .cta-btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(45deg, var(--accent-glow), var(--accent-purple));
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
        }

        /* 공통 섹션 스타일 */
        section {
            padding: 120px 0;
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 50px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 40px;
            height: 4px;
            background-color: var(--accent-glow);
            border-radius: 2px;
        }

        /* About 섹션 */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .about-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .info-tag {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-glow);
            margin-bottom: 15px;
        }

        /* 기술 스택 섹션 */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .tech-card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.3s, border-color 0.3s;
        }

        .tech-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .tech-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .tech-card p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* 경험(프로젝트) 섹션 */
        .exp-timeline {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .exp-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .exp-title {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .exp-period {
            color: var(--accent-purple);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* 연락처 */
        .contact-box {
            background: linear-gradient(135deg, #161920 0%, #0d0e12 100%);
            border-radius: 24px;
            padding: 60px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-box p {
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .contact-item {
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .contact-item:hover {
            background: var(--text-main);
            color: #000;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: #475569;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        /* 반응형 모바일 디자인 */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.8rem; }
            .about-grid { grid-template-columns: 1fr; }
            .exp-header { flex-direction: column; gap: 5px; }
            .contact-links { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- 상단 고정 바 -->
    <nav>
        <div class="container nav-container">
            <div class="logo">YE SUNG</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#tech">Tech</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- 메인 대문 (Hero) -->
    <div class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>
                    <span>HELLO, I'M</span>
                    <span class="highlight">WOO YE SUNG</span>
                </h1>
                <p class="hero-desc">
                    세명컴퓨터고등학교 스마트보안솔루션과에서 보안의 기초를 다지고, 매일 노력을 더해 프론트엔드 개발자로 거듭나고 있습니다.
                </p>
                <a href="#contact" class="cta-btn">Get In Touch</a>
            </div>
        </div>
    </div>

    <!-- About 섹션 -->
    <section id="about">
        <div class="container">
